map_hash_bucket_size 256; # see http://nginx.org/en/docs/hash.html

map $request_uri $redirect_uri_301  {
    include /etc/nginx/redirect_uri_301.map;
}

map $request_uri $redirect_uri_302  {
    include /etc/nginx/redirect_uri_302.map;
}

# Language used for URLs without a language prefix.
map $http_accept_language $lang {
    default en;
    ~*de de;
    ~*it it;
    ~*sr sr;
    ~*pt[-_]?br pt_BR;
}

# Language of the requested app, used to serve the matching 404 page.
map $request_uri $request_lang {
    default en;
    ~^/(?<app_lang>en|de|it|sr|pt_BR)(/|$) $app_lang;
}

server {
    # https://vitepress.dev/guide/deploy#nginx
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    listen 80;
    server_name _;
    index index.html;

    # content location, every language is an app in its own directory
    root /app;

    if ($redirect_uri_301) {
        return 301 $redirect_uri_301;
    }

    if ($redirect_uri_302) {
        return 302 $redirect_uri_302;
    }

    # entry point: let the browser decide which app to use
    location = / {
        return 302 /$lang/;
    }

    # Internal links may carry a language prefix of their own (the English
    # content links to `/en/...`, translations cross-link to `/en/...`). An app
    # prepends its own base path to them, so they arrive as
    # `/<app>/<language>/...` and are collapsed back to the intended app.
    rewrite "^/(en|de|it|sr|pt_BR)/(en|de|it|sr|pt_BR)(/.*)$" /$2$3 permanent;

    # adjust caching headers
    # files in the assets folder have hashes filenames
    location ~* ^/(en|de|it|sr|pt_BR)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # one self-contained app per language
    # exact matches -> reverse clean urls -> folders -> not found
    location ~ ^/(en|de|it|sr|pt_BR)/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # naked and top level links are sent to the detected language
    location / {
        return 302 /$lang$request_uri;
    }

    # non existent pages are served by the app that was requested
    error_page 404 /$request_lang/404.html;

    # a folder without index.html raises 403 in this setup
    error_page 403 /$request_lang/404.html;
}
