# Vale configuration for Zammad documentation.
# Run manually:  pnpm vale
# Pre-commit:    runs automatically via lint-staged on staged src/en/**/*.md
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Vale, zammad

# Skip fenced code blocks so brand-name rules don't fire on CLI commands,
# env var names, or package names in code samples.
BlockIgnores = (^|\n)\x60\x60\x60[^\n]*\n[\s\S]*?\x60\x60\x60

# Vale.Spelling: no custom dictionary; false positives on tech terms.
Vale.Spelling = NO
