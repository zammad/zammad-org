# Production stack: the CI deploy job copies this file to the web host.
# Locally, `docker-compose.override.yml` adds the image build, see README.md.
#
# Both keys are required (see README.md, "Keys"): the admin key of Typesense
# and the search-only key that nginx adds to the search requests of browsers
# and the MCP server uses for its searches.
# On the web host, they are in the root-only .env next to this file, prepared
# by the host's administrators; the deploy job does not touch it. Locally, the
# dev keys of docker/.env are used.
#
# Starting the stack also loads the search index of this release: the
# `search-init` service runs once and exits.
services:
  nginx:
    image: ${IMAGE_REPO:-zammad-org}:${IMAGE_VERSION:-local}
    restart: unless-stopped
    ports:
    # Only the reverse proxy on the host talks to the container. 8081 instead
    # of 80: the image runs as non-root, and 8080 is often taken by Zammad.
    - 127.0.0.1:${ZAMMAD_ORG_PORT:-8081}:8080
    environment:
      # Rendered into the search proxy by the image's entrypoint, see
      # nginx/templates/.
      TYPESENSE_SEARCH_KEY: ${TYPESENSE_SEARCH_KEY:?TYPESENSE_SEARCH_KEY is not set, see docker/README.md}
    # `docker compose up --wait` in the deploy job waits for this check.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    # No `depends_on` on Typesense or the MCP server: the site has to be
    # served even when they are down. nginx resolves them per request instead.
    networks:
    - default
    - search

  # Search index of all languages, see .vitepress/search/. Not reachable from
  # outside: browsers search through nginx (`/search-api/`), `search-init`
  # loads the index over the stack's network. The port below is for the host's
  # administrators only, see the runbook in README.md.
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    ports:
    - 127.0.0.1:${TYPESENSE_PORT:-8108}:8108
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_ADMIN_KEY:?TYPESENSE_ADMIN_KEY is not set, see docker/README.md}
      TYPESENSE_DATA_DIR: /data
      # On start, Typesense restores its last snapshot and replays the changes
      # since; without a snapshot, the replay can lose the latest changes. The
      # default interval is an hour; `search-init` also requests a snapshot
      # after loading, this covers changes by hand (e.g. a rollback of an alias).
      TYPESENSE_SNAPSHOT_INTERVAL_SECONDS: 60
    volumes:
    - typesense-data:/data
    # `default` for `search-init` and the published port; `search` for the MCP
    # server.
    networks:
    - default
    - search
    # The image has neither curl nor wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true

  # Loads the search index of this release into Typesense, then exits: the
  # image of the same build as the site, with its `search-index/` (see
  # Dockerfile). Languages whose index is loaded already are skipped, so a
  # start without changes loads nothing. nginx does not wait for it: the site
  # goes live right away, and until the new index is in, the search uses the
  # previous one (or reports itself unavailable, e.g. on the first start). The
  # deploy job does not wait for it; see README.md for how to check it.
  search-init:
    image: ${IMAGE_REPO:-zammad-org}:${IMAGE_VERSION:-local}-search-init
    restart: "no"
    depends_on:
      typesense:
        condition: service_healthy
    environment:
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_ADMIN_KEY: ${TYPESENSE_ADMIN_KEY:?TYPESENSE_ADMIN_KEY is not set, see docker/README.md}
      # Created in Typesense unless it exists, for nginx and the MCP server.
      TYPESENSE_SEARCH_KEY: ${TYPESENSE_SEARCH_KEY:?TYPESENSE_SEARCH_KEY is not set, see docker/README.md}
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true

  # MCP server of the documentation (../mcp/, see mcp/README.md), public at
  # `/mcp` through nginx. Only on the internal `search` network: it reaches
  # Typesense and nginx, and nothing else, no other host and no internet.
  mcp:
    image: ${IMAGE_REPO:-zammad-org}:${IMAGE_VERSION:-local}-mcp
    restart: unless-stopped
    environment:
      TYPESENSE_URL: http://typesense:8108
      # The same search-only key as nginx, see README.md ("Keys").
      TYPESENSE_SEARCH_KEY: ${TYPESENSE_SEARCH_KEY:?TYPESENSE_SEARCH_KEY is not set, see docker/README.md}
    networks:
    - search
    healthcheck:
      test: ["CMD", "bin/healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true

networks:
  # Typesense, nginx and the MCP server; no way out.
  search:
    internal: true

volumes:
  typesense-data:
