# Example vhost for the reverse proxy in front of the container, to be set up
# once by the host's administrators. Everything behind it (redirects, caching,
# security headers, error pages) is configured in this repository.
#
# Remove headers from the existing vhost that the container now sets itself
# (X-Frame-Options, X-Content-Type-Options, X-Robots-Tag), or they are sent
# twice.
#
# nginx does not read environment variables, so render the port from the
# deployment's `.env` first. Only substitute ZAMMAD_ORG_PORT, the nginx
# variables ($host, ...) must stay untouched:
#
#   set -a; . ~<deploy user>/zammad-org/.env; set +a
#   envsubst '${ZAMMAD_ORG_PORT}' < reverse-proxy.example.conf > next.zammad.org.conf

server {
    listen 80;
    listen [::]:80;
    server_name next.zammad.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name next.zammad.org;

    ssl_certificate     /etc/ssl/next.zammad.org/fullchain.pem;
    ssl_certificate_key /etc/ssl/next.zammad.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        # ZAMMAD_ORG_PORT of the deployment, 8081 by default.
        proxy_pass http://127.0.0.1:${ZAMMAD_ORG_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
