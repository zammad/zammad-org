map_hash_bucket_size 256; # see http://nginx.org/en/docs/hash.html

# Redirect maps match `$uri`, the decoded path without the query string, so
# that `/english?ref=link` finds its entry as well; both `return` statements
# append the arguments again (`/en/?ref=link`, `https://zammad.com?ref=link`).
map $uri $redirect_uri_301  {
    include /etc/nginx/redirect_uri_301.map;
}

map $uri $redirect_uri_302  {
    include /etc/nginx/redirect_uri_302.map;
}

# Language used for URLs without a language prefix (`/`, `/some/page`).
#
# Browsers list their languages in the order the reader prefers them, so the
# earliest tag of the header that we have an app for wins: `cs-CZ,cs;q=0.9,de`
# and `sk,cs;q=0.9,de;q=0.8` serve Czech, `nl,en;q=0.9,de;q=0.5` English.
# `$accept_lang` is the language code of that tag as the browser wrote it
# (`DE`, `pt-BR`), `$lang` the app for it; exact keys of a map ignore case.
#
# A code has to end its tag or continue with subtags only (`cs-CZ`,
# `sr-Latn-RS`), never with another letter, so `enm` and `csb` are no language
# of ours. Matching a code anywhere in the header reads a region as a
# language: `en-IT` served Italian, and `x-cs` Czech.
#
# A tag with `q=0` ("not this language") is skipped: `de;q=0,en;q=0.5` serves
# English. Ranking the tags by their q-values rather than their order is what
# this cannot do: it means parsing the tag list (`pt-BR;q=0.8`, `*`), which
# `map` cannot do — that needs Lua and with it a different nginx image, or a
# subrequest.
map $http_accept_language $accept_lang {
    default "";
    "~*^(?:[^,]*,)*?\s*(?<accept_code>en|de|it|sr|pt[-_]?br|cs)(?:[-_][a-z0-9]{1,8})*\s*(?!;\s*q=0(?:\.0{0,3})?\s*(?:,|$))(?:;|,|$)" $accept_code;
}

map $accept_lang $lang {
    default en;
    en en;
    de de;
    it it;
    sr sr;
    ~*^pt[-_]?br$ pt_BR;
    cs cs;
}

# Language of the requested app, used to serve the matching 404 page. This list
# stays explicit where the others below became patterns: it selects an app that
# has to exist, so an unknown prefix has to fall back to English instead of
# asking for a `/xx/404.html` that is not there.
map $request_uri $request_lang {
    default en;
    ~^/(?<app_lang>en|de|it|sr|pt_BR|cs)(/|$) $app_lang;
}

# Search requests per client, see `/search-api/` below. The client address is
# the one forwarded by the reverse proxy (`real_ip_header`).
limit_req_zone $binary_remote_addr zone=search:1m rate=10r/s;

# Requests to the MCP server per client, see `/mcp` below. The internal chat
# sends the requests of all its users from one address, hence the burst.
limit_req_zone $binary_remote_addr zone=mcp:1m rate=10r/s;

server {
    # https://vitepress.dev/guide/deploy#nginx
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    listen 8080;
    server_name _;
    index index.html;
    server_tokens off;

    # The site runs behind a TLS-terminating reverse proxy, so redirects must
    # not carry this server's own scheme, host and port. Relative `Location`
    # headers are resolved by the browser against the public URL.
    absolute_redirect off;

    # Log the client address forwarded by the reverse proxy. Only trust
    # loopback and private networks: the published port is bound to
    # 127.0.0.1 on the host, so the proxy reaches us from one of them.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    # container health check, see docker-compose.yml
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Search of all apps, served by Typesense (see docker-compose.yml and
    # .vitepress/search/). Browsers may only run searches: one endpoint, POST
    # only, with the search-only key added here. Every other Typesense
    # endpoint is unreachable from outside.
    location = /search-api/multi_search {
        limit_except POST {
            deny all;
        }

        limit_req zone=search burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # Resolved per request, so that nginx starts and serves the site even
        # when Typesense is down. 127.0.0.11 is Docker's embedded DNS server.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $typesense http://typesense:8108;

        # The query string of the client is not passed on: all search
        # parameters are in the body. Only the limit below is added, so that a
        # request cannot bundle more searches than the site sends (2: results
        # and filter counts, see .vitepress/theme/search/typesense.mts) instead
        # of Typesense's default of 50. It cannot be raised from the body.
        proxy_pass $typesense/multi_search?limit_multi_searches=2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        include /tmp/search-api-key.conf;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /search-api/ {
        return 404;
    }

    # MCP server of the documentation (mcp/, see mcp/README.md): stateless
    # Streamable HTTP, one POST per request with a JSON answer, no sessions.
    # Public and read-only; the rate limit is the abuse control. The client
    # address is not passed on: the server logs queries, not who sent them.
    location = /mcp {
        if ($request_method != POST) {
            add_header Allow "POST" always;
            include /etc/nginx/snippets/security-headers.conf;
            return 405;
        }

        limit_req zone=mcp burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        # Resolved per request, so that nginx starts and serves the site even
        # when the MCP server is down. 127.0.0.11 is Docker's embedded DNS server.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mcp http://mcp:9292;

        proxy_pass $mcp/mcp;
        proxy_http_version 1.1;
        # The server checks Host and Origin against DNS rebinding.
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /mcp/ {
        return 404;
    }

    # content location, every language is an app in its own directory
    root /app;

    if ($redirect_uri_301) {
        return 301 $redirect_uri_301$is_args$args;
    }

    if ($redirect_uri_302) {
        return 302 $redirect_uri_302$is_args$args;
    }

    # entry point: let the browser decide which app to use, the arguments stay
    location = / {
        return 302 /$lang/$is_args$args;
    }

    # The language prefix of a URL is a pattern, not the list of supported
    # languages, so that a new language does not mean editing every rule below.
    # An unknown prefix reaches the file system and is a 404 there. That is why
    # `pnpm check:nginx` refuses a top-level page or folder named like a
    # language (`ai/`): its unprefixed links would end there too, instead of
    # being redirected to the detected language by `location /`.
    #
    # A bare language path (`/cs`, `/pt_BR`) has its app below the trailing
    # slash; only the language itself is redirected, anything after it
    # (`/en/…`, `/cs/…`) keeps going to the app's own locations.
    location ~ "^/[a-z]{2}(?:_[A-Z]{2})?$" {
        return 301 $uri/$is_args$args;
    }

    # Internal links may carry a language prefix of their own (the English
    # content links to `/en/...`, translations cross-link to `/en/...`). An app
    # prepends its own base path to them, so they arrive as
    # `/<app>/<language>/...` and are collapsed back to the intended app.
    #
    # The second segment decides which app the reader ends up in, so it names
    # the languages instead of being a pattern: a pattern would send
    # `/cs/xx/missing` to an app that does not exist and answer it in English.
    # nginx cannot interpolate a variable into a `rewrite` pattern, so the list
    # is spelled out — `pnpm check:nginx` compares it, and the one in
    # `$request_lang`, with `.vitepress/search/locales.mts`.
    rewrite "^(/[a-z]{2}(?:_[A-Z]{2})?)/(en|de|it|sr|pt_BR|cs)(/.*)$" /$2$3 permanent;

    # adjust caching headers
    # files in the assets folder have hashes filenames
    location ~* "^/[a-z]{2}(?:_[A-Z]{2})?/assets/" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # For assistants and coding agents: the `llms.txt` of every app and the
    # Markdown version of every page (`foo/bar.md` next to `foo/bar.html`),
    # generated by the build. `mime.types` has no type for `.md`, and neither
    # type carries a charset by default. See
    # https://github.com/zammad/zammad-org/issues/239.
    location ~ "^/[a-z]{2}(?:_[A-Z]{2})?/llms\.txt$" {
        charset utf-8;
        try_files $uri =404;
    }

    location ~ "^/[a-z]{2}(?:_[A-Z]{2})?/.+\.md$" {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        try_files $uri =404;
    }

    # Agents look for `llms.txt` at the root first; the English one links to
    # the other languages.
    location = /llms.txt {
        charset utf-8;
        try_files /en/llms.txt =404;
    }

    # one self-contained app per language
    # exact matches -> reverse clean urls -> folders -> not found
    location ~ "^/[a-z]{2}(?:_[A-Z]{2})?/" {
        try_files $uri $uri.html $uri/ =404;
    }

    # naked and top level links are sent to the detected language
    location / {
        return 302 /$lang$request_uri;
    }

    # non existent pages are served by the app that was requested
    error_page 404 /$request_lang/404.html;

    # a folder without index.html raises 403 in this setup
    error_page 403 /$request_lang/404.html;
}
