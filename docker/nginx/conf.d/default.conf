map_hash_bucket_size 256; # see http://nginx.org/en/docs/hash.html

map $request_uri $redirect_uri_301  {
    include /etc/nginx/redirect_uri_301.map;
}

map $request_uri $redirect_uri_302  {
    include /etc/nginx/redirect_uri_302.map;
}

# Language used for URLs without a language prefix.
map $http_accept_language $lang {
    default en;
    ~*de de;
    ~*it it;
    ~*sr sr;
    ~*pt[-_]?br pt_BR;
}

# Language of the requested app, used to serve the matching 404 page.
map $request_uri $request_lang {
    default en;
    ~^/(?<app_lang>en|de|it|sr|pt_BR)(/|$) $app_lang;
}

# Search requests per client, see `/search-api/` below. The client address is
# the one forwarded by the reverse proxy (`real_ip_header`).
limit_req_zone $binary_remote_addr zone=search:1m rate=10r/s;

# Requests to the MCP server per client, see `/mcp` below. The internal chat
# sends the requests of all its users from one address, hence the burst.
limit_req_zone $binary_remote_addr zone=mcp:1m rate=10r/s;

server {
    # https://vitepress.dev/guide/deploy#nginx
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    listen 8080;
    server_name _;
    index index.html;
    server_tokens off;

    # The site runs behind a TLS-terminating reverse proxy, so redirects must
    # not carry this server's own scheme, host and port. Relative `Location`
    # headers are resolved by the browser against the public URL.
    absolute_redirect off;

    # Log the client address forwarded by the reverse proxy. Only trust
    # loopback and private networks: the published port is bound to
    # 127.0.0.1 on the host, so the proxy reaches us from one of them.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    # container health check, see docker-compose.yml
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Search of all apps, served by Typesense (see docker-compose.yml and
    # .vitepress/search/). Browsers may only run searches: one endpoint, POST
    # only, with the search-only key added here. Every other Typesense
    # endpoint is unreachable from outside.
    location = /search-api/multi_search {
        limit_except POST {
            deny all;
        }

        limit_req zone=search burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        # Resolved per request, so that nginx starts and serves the site even
        # when Typesense is down. 127.0.0.11 is Docker's embedded DNS server.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $typesense http://typesense:8108;

        # The query string of the client is not passed on: all search
        # parameters are in the body. Only the limit below is added, so that a
        # request cannot bundle more searches than the site sends (2: results
        # and filter counts, see .vitepress/theme/search/typesense.mts) instead
        # of Typesense's default of 50. It cannot be raised from the body.
        proxy_pass $typesense/multi_search?limit_multi_searches=2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        include /tmp/search-api-key.conf;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /search-api/ {
        return 404;
    }

    # MCP server of the documentation (mcp/, see mcp/README.md): stateless
    # Streamable HTTP, one POST per request with a JSON answer, no sessions.
    # Public and read-only; the rate limit is the abuse control. The client
    # address is not passed on: the server logs queries, not who sent them.
    location = /mcp {
        if ($request_method != POST) {
            add_header Allow "POST" always;
            include /etc/nginx/snippets/security-headers.conf;
            return 405;
        }

        limit_req zone=mcp burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;

        # Resolved per request, so that nginx starts and serves the site even
        # when the MCP server is down. 127.0.0.11 is Docker's embedded DNS server.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mcp http://mcp:9292;

        proxy_pass $mcp/mcp;
        proxy_http_version 1.1;
        # The server checks Host and Origin against DNS rebinding.
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /mcp/ {
        return 404;
    }

    # content location, every language is an app in its own directory
    root /app;

    if ($redirect_uri_301) {
        return 301 $redirect_uri_301;
    }

    if ($redirect_uri_302) {
        return 302 $redirect_uri_302;
    }

    # entry point: let the browser decide which app to use
    location = / {
        return 302 /$lang/;
    }

    # Internal links may carry a language prefix of their own (the English
    # content links to `/en/...`, translations cross-link to `/en/...`). An app
    # prepends its own base path to them, so they arrive as
    # `/<app>/<language>/...` and are collapsed back to the intended app.
    rewrite "^/(en|de|it|sr|pt_BR)/(en|de|it|sr|pt_BR)(/.*)$" /$2$3 permanent;

    # adjust caching headers
    # files in the assets folder have hashes filenames
    location ~* ^/(en|de|it|sr|pt_BR)/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # For assistants and coding agents: the `llms.txt` of every app and the
    # Markdown version of every page (`foo/bar.md` next to `foo/bar.html`),
    # generated by the build. `mime.types` has no type for `.md`, and neither
    # type carries a charset by default. See
    # https://github.com/zammad/zammad-org/issues/239.
    location ~ ^/(en|de|it|sr|pt_BR)/llms\.txt$ {
        charset utf-8;
        try_files $uri =404;
    }

    location ~ ^/(en|de|it|sr|pt_BR)/.+\.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        try_files $uri =404;
    }

    # Agents look for `llms.txt` at the root first; the English one links to
    # the other languages.
    location = /llms.txt {
        charset utf-8;
        try_files /en/llms.txt =404;
    }

    # one self-contained app per language
    # exact matches -> reverse clean urls -> folders -> not found
    location ~ ^/(en|de|it|sr|pt_BR)/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # naked and top level links are sent to the detected language
    location / {
        return 302 /$lang$request_uri;
    }

    # non existent pages are served by the app that was requested
    error_page 404 /$request_lang/404.html;

    # a folder without index.html raises 403 in this setup
    error_page 403 /$request_lang/404.html;
}
