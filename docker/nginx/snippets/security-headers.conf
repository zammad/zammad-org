# Included in every block that sets its own headers: nginx drops inherited
# `add_header` directives as soon as a block defines one of its own.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# next.zammad.org is not meant to be indexed yet.
add_header X-Robots-Tag "noindex" always;
