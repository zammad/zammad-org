---
image: $CI_REGISTRY/docker/zammad-ci:stable

workflow:
  rules:
    # Avoid duplicate branch and MR pipelines for push events to branches with an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # Don't create branch pipelines for pushes to private branches (as there will also be a MR for them).
    - if: $CI_COMMIT_BRANCH =~ /^(private|cherry-pick-|renovate|dependabot)/ && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always

stages:
  - pre
  - lint
  - screenshots
  - build documentation
  - check search index
  - build docker image
  - deploy

variables:
  # Workaround: https://github.com/moby/buildkit/issues/7007
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

push to github:
  stage: pre
  before_script:
    - test -d $HOME/.ssh || mkdir $HOME/.ssh
    - ssh-keyscan github.com >> $HOME/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - echo "$PUSH_TO_GITHUB_SSH_PRIVATE_KEY" | ssh-add -
    - ssh-add -l
  script:
    - git fetch --unshallow
    - .gitlab/push_to_github.sh git@github.com:zammad/zammad-org.git
  only:
    - develop
    - stable

disable squash for weblate MRs:
  stage: pre
  image:
    name: alpine/curl:latest
    entrypoint: ['']
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /weblate-merge$/ && $CI_MERGE_REQUEST_SQUASH_ON_MERGE == "true"'
  before_script: []
  script:
    - echo "⚠️ Disabling squash option for this MR..."
    - |
      curl --fail-with-body --request PUT --header "PRIVATE-TOKEN: ${WEBLATE_ACCESS_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}?squash=false"
    - echo "✅ Squash option successfully disabled via API."
  after_script: []

# This job will create commits in pipelines pushed from Weblate.
# It re-generates the translation catalog (.po4a.conf and the POT file). The
# translated content itself is not tracked, it is generated at build time.
push translations update commit:
  stage: pre
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_MESSAGE =~ /Translations update from translations[.]zammad[.]org/
      when: always
    - when: never
  script:
    - pnpm install
    - pnpm i18n
    - git status
    - git config user.email "noreply@weblate.org"
    - git config user.name "Weblate"
    # Pushing via CI_JOB_TOKEN does not trigger another pipeline, so use a dedicated token.
    - git remote add gitlab_origin https://oauth2:${WEBLATE_ACCESS_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git
    - git add .
    - git status --porcelain | grep "^[MA]" || exit 0 # check if files were added/changed
    - 'git commit -m "Maintenance: Update translated files and catalog"'
    - git show --stat
    - git push gitlab_origin HEAD:$CI_COMMIT_REF_NAME

markdownlint:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:latest
    entrypoint: [""]
  script:
    - markdownlint-cli2 "src/en/**/*.md"

vale:
  stage: lint
  image:
    name: jdkato/vale:latest
    entrypoint: [""]
  script:
    - vale --config=.vale.ini src/en/

screenshots:
  stage: screenshots
  image: docker
  before_script:
    - .screenshots/zammad-stack/start.sh
    - docker ps
  script:
    - .screenshots/zammad-stack/screenshots.sh
    - test -d src/public/screenshots/cypress # check that screenshots were copied from the container
  after_script:
    - .screenshots/zammad-stack/stop.sh
    - docker ps
  artifacts:
    name: screenshots
    expose_as: "Generated Screenshots"
    expire_in: 1 week
    paths:
      - src/public/screenshots/cypress

build documentation:
  stage: build documentation
  script:
    - pnpm install
    # Builds every language into its own directory below dist/, and its search
    # documents into search-index/.
    - pnpm build
  artifacts:
    name: static-html
    expose_as: "Generated Website HTML"
    expire_in: 1 week
    paths:
      - dist
      - search-index

# Loads the search documents of every language into a throwaway Typesense and
# runs the search checks against it, see .vitepress/search/. Fails the pipeline
# when the index cannot be built or does not answer as expected. The keys are
# made up for this job; the production keys are only used by the deploy job.
check search index:
  stage: check search index
  needs:
    - build documentation
  services:
    - name: typesense/typesense:30.2
      alias: typesense
  variables:
    # Configuration of the Typesense service container.
    TYPESENSE_API_KEY: ci-check-admin-key
    TYPESENSE_DATA_DIR: /tmp
  script:
    - node --version
    # The local search of VitePress must not come back.
    - |
      if grep -rl --include='*.js' localSearchIndex dist/; then
        echo "The VitePress local search index is part of the build, see .vitepress/config.mts."
        exit 1
      fi
    - TYPESENSE_URL=http://typesense:8108 TYPESENSE_ADMIN_KEY=ci-check-admin-key TYPESENSE_SEARCH_KEY=ci-check-search-key node .vitepress/search/indexer.mts en de sr it pt_BR
    - TYPESENSE_URL=http://typesense:8108 TYPESENSE_SEARCH_KEY=ci-check-search-key node .vitepress/search/check.mts en de sr it pt_BR

# Only needed for the container deployment, see `deploy to website`.
build docker image:
  stage: build docker image
  image: docker:latest
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:develop
  script:
    - docker build --pull -f docker/Dockerfile -t "$IMAGE" .
    - docker run --rm "$IMAGE" nginx -t
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE"
    - docker logout "$CI_REGISTRY"
  only:
    - develop

deploy to website:
  stage: deploy
  before_script:
    - apt update && apt install -y --no-install-recommends rsync
  script:
    # The keys of the stack are in the .env file next to docker-compose.yml on
    # the web host, prepared by its administrators; this job neither writes nor
    # reads it. The indexer needs the same values as masked and protected CI
    # variables, see docker/README.md ("Keys").
    - |
      if [ -z "$TYPESENSE_ADMIN_KEY" ] || [ -z "$TYPESENSE_SEARCH_KEY" ]; then
        echo "TYPESENSE_ADMIN_KEY and TYPESENSE_SEARCH_KEY must be set, see docker/README.md."
        exit 1
      fi
    - test -d $HOME/.ssh || mkdir $HOME/.ssh
    - ssh-keyscan -4 $DEPLOYHOST_COMMUNITY >> $HOME/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY_COMMUNITY")
    - rsync -avz docker/docker-compose.yml $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY:/opt/zammad-org/
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY"
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml pull"
    # Search first: the new content is indexed before the new site goes live.
    # The indexer checks the new collections before it switches the aliases
    # to them, so a failure stops the deploy with the previous site and index
    # still in place. Typesense listens on 127.0.0.1 of the host only, so the
    # indexer reaches it through an SSH tunnel.
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml up -d --wait typesense"
    - ssh -4 -f -N -o ExitOnForwardFailure=yes -L 18108:127.0.0.1:8108 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY
    - TYPESENSE_URL=http://127.0.0.1:18108 node .vitepress/search/indexer.mts en de sr it pt_BR
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml up -d --remove-orphans --wait"
    # nginx searches with the search-only key from the .env on the web host,
    # the indexer made sure of the one from the CI variable. One search through
    # nginx shows that they are the same: a mismatch would leave the site
    # searching with a key that Typesense refuses.
    - |
      ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml exec -T nginx wget -q -O - --header 'Content-Type: application/json' --post-data '{\"searches\":[{\"collection\":\"docs_en\",\"q\":\"*\",\"per_page\":0}]}' http://127.0.0.1:8080/search-api/multi_search" | grep -q '"found"' || {
        echo "The site cannot search through nginx. Most likely TYPESENSE_SEARCH_KEY in the .env on the web host differs from the CI variable, see docker/README.md."
        exit 1
      }
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker logout $CI_REGISTRY"
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker image prune -a -f"
  only:
    - develop
