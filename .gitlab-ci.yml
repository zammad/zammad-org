---
default:
  image: $CI_REGISTRY/docker/zammad-ci:stable
  # A new pipeline for the same branch or MR cancels the running one, see
  # "Auto-cancel redundant pipelines" in the CI/CD settings. Jobs that change
  # the outside world opt out with `interruptible: false`.
  interruptible: true

workflow:
  rules:
    # Avoid duplicate branch and MR pipelines for push events to branches with an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # Don't create branch pipelines for pushes to private branches (as there will also be a MR for them).
    - if: $CI_COMMIT_BRANCH =~ /^(private|cherry-pick-|renovate|dependabot)/ && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always

stages:
  - pre
  - lint
  - screenshots
  - build documentation
  - check search index
  - build docker image
  - deploy

variables:
  # Workaround: https://github.com/moby/buildkit/issues/7007
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  # Offered by the "Run pipeline" form, see the screenshots jobs below.
  FORCE_SCREENSHOTS:
    value: "false"
    options:
      - "false"
      - "true"
    description: Generate the screenshots in this pipeline instead of reusing those of develop.

# Keeps the pnpm store between pipelines for as long as pnpm-lock.yaml does not
# change, so that `pnpm install` links the packages instead of downloading them.
.pnpm store cache:
  cache:
    key:
      prefix: pnpm-store
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - pnpm config set store-dir .pnpm-store

push to github:
  stage: pre
  before_script:
    - test -d $HOME/.ssh || mkdir $HOME/.ssh
    - ssh-keyscan github.com >> $HOME/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - echo "$PUSH_TO_GITHUB_SSH_PRIVATE_KEY" | ssh-add -
    - ssh-add -l
  script:
    - git fetch --unshallow
    - .gitlab/push_to_github.sh git@github.com:zammad/zammad-org.git
  only:
    - develop
    - stable

disable squash for weblate MRs:
  stage: pre
  image:
    name: alpine/curl:latest
    entrypoint: ['']
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /weblate-merge$/ && $CI_MERGE_REQUEST_SQUASH_ON_MERGE == "true"'
  before_script: []
  script:
    - echo "⚠️ Disabling squash option for this MR..."
    - |
      curl --fail-with-body --request PUT --header "PRIVATE-TOKEN: ${WEBLATE_ACCESS_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}?squash=false"
    - echo "✅ Squash option successfully disabled via API."
  after_script: []

# This job will create commits in pipelines pushed from Weblate.
# It re-generates the translation catalog (.po4a.conf and the POT file). The
# translated content itself is not tracked, it is generated at build time.
push translations update commit:
  stage: pre
  extends: .pnpm store cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_MESSAGE =~ /Translations update from translations[.]zammad[.]org/
      when: always
    - when: never
  script:
    - pnpm install --frozen-lockfile
    - pnpm i18n
    - git status
    - git config user.email "noreply@weblate.org"
    - git config user.name "Weblate"
    # Pushing via CI_JOB_TOKEN does not trigger another pipeline, so use a dedicated token.
    - git remote add gitlab_origin https://oauth2:${WEBLATE_ACCESS_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git
    - git add .
    - git status --porcelain | grep "^[MA]" || exit 0 # check if files were added/changed
    - 'git commit -m "Maintenance: Update translated files and catalog"'
    - git show --stat
    - git push gitlab_origin HEAD:$CI_COMMIT_REF_NAME

markdownlint:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:latest
    entrypoint: [""]
  script:
    - markdownlint-cli2 "src/en/**/*.md"

vale:
  stage: lint
  image:
    name: jdkato/vale:latest
    entrypoint: [""]
  script:
    - vale --config=.vale.ini src/en/

# Generating the screenshots takes a Zammad stack and most of the pipeline's
# time, so only some pipelines do it: the nightly one of develop (a pipeline
# schedule, which keeps the screenshots in step with the Zammad develop UI),
# those of stable (another Zammad version), those that change the suite or this
# file, and those started with FORCE_SCREENSHOTS=true. All others run
# `screenshots:reuse` instead. Keep the rules of both jobs inverse.
#
# `changes` is limited to push and merge request pipelines: in all others, such
# as those of "Run pipeline", GitLab has nothing to compare with and counts
# every file as changed.
screenshots:
  stage: screenshots
  # Needs nothing from the lint jobs, so it starts right away: it is the
  # longest job of the pipeline.
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $FORCE_SCREENSHOTS == "true"
    - if: $CI_COMMIT_BRANCH == "stable"
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .screenshots/**/*
        - .gitlab-ci.yml
  image: docker
  before_script:
    - .screenshots/zammad-stack/start.sh
    - docker ps
  script:
    - .screenshots/zammad-stack/screenshots.sh
    - test -d src/public/screenshots/generated # check that screenshots were copied from the container
  after_script:
    - .screenshots/zammad-stack/stop.sh
    - docker ps
  artifacts:
    name: screenshots
    expose_as: "Generated Screenshots"
    # Long enough for `screenshots:reuse`, see there.
    expire_in: 30 days
    paths:
      - src/public/screenshots/generated

# Takes the screenshots from the latest successful pipeline of develop. GitLab
# looks for the job in that pipeline only, which has run either `screenshots`
# or this job; this job passes the screenshots on as its own artifact. Both
# keep them for 30 days, and every successful pipeline of develop starts that
# time anew, so they expire only after 30 days without one. GitLab's "Keep
# artifacts from most recent successful jobs" is off on this instance.
screenshots:reuse:
  stage: screenshots
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $FORCE_SCREENSHOTS == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == "stable"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .screenshots/**/*
        - .gitlab-ci.yml
      when: never
    - when: on_success
  image:
    name: alpine/curl:latest
    entrypoint: ['']
  variables:
    GIT_STRATEGY: none
  script:
    - rm -rf screenshots.zip src/public/screenshots/generated
    - |
      download() {
        echo "Downloading the artifacts of the job $1 of develop..."
        curl --fail --silent --show-error --location --output screenshots.zip \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/develop/download?job=$1"
      }
      # Each request looks the latest successful pipeline of develop up anew. When
      # another one succeeds between the two, the second request asks the new
      # pipeline for the job it does not have: ask for both once more.
      download_either() {
        download screenshots || download screenshots:reuse
      }
      download_either || download_either || {
        echo "The latest successful pipeline of develop has no screenshots, run one with FORCE_SCREENSHOTS=true."
        exit 1
      }
    - unzip -q screenshots.zip
    - test -d src/public/screenshots/generated
    - find src/public/screenshots/generated -name '*.png' | wc -l
  artifacts:
    name: screenshots
    expose_as: "Reused Screenshots"
    expire_in: 30 days
    paths:
      - src/public/screenshots/generated

build documentation:
  stage: build documentation
  extends: .pnpm store cache
  # Either of the two runs, see their rules.
  needs:
    - job: screenshots
      optional: true
    - job: screenshots:reuse
      optional: true
  script:
    - pnpm install --frozen-lockfile
    # The language lists of the nginx config have to match the site's, see
    # docker/check_nginx_locales.mts.
    - pnpm check:nginx
    # Builds every language into its own directory below dist/, its search
    # documents into search-index/ and the data of the MCP server into
    # agent-data/.
    - pnpm build
  artifacts:
    name: static-html
    expose_as: "Generated Website HTML"
    expire_in: 1 week
    paths:
      - dist
      - search-index
      - agent-data

# Loads the search documents of every language into a throwaway Typesense and
# runs the search checks against it, see .vitepress/search/. Fails the pipeline
# when the index cannot be built or does not answer as expected. The keys are
# made up for this job; the production keys exist only on the web host.
check search index:
  stage: check search index
  needs:
    - build documentation
  services:
    - name: typesense/typesense:30.2
      alias: typesense
  variables:
    # Configuration of the Typesense service container.
    TYPESENSE_API_KEY: ci-check-admin-key
    TYPESENSE_DATA_DIR: /tmp
  script:
    - node --version
    # The local search of VitePress must not come back.
    - |
      if grep -rl --include='*.js' localSearchIndex dist/; then
        echo "The VitePress local search index is part of the build, see .vitepress/config.mts."
        exit 1
      fi
    # The locale arguments are left out: the indexer and the check cover every
    # `search-index/*.jsonl` the build produced and fail on a locale that is
    # missing, so no list has to be kept here.
    - TYPESENSE_URL=http://typesense:8108 TYPESENSE_ADMIN_KEY=ci-check-admin-key TYPESENSE_SEARCH_KEY=ci-check-search-key node .vitepress/search/indexer.mts
    - TYPESENSE_URL=http://typesense:8108 TYPESENSE_SEARCH_KEY=ci-check-search-key node .vitepress/search/check.mts

# The MCP server (mcp/, see mcp/README.md): RuboCop and the specs, then the
# specs against the build output of this pipeline, with its own throwaway
# Typesense loaded with the search documents of this pipeline. The keys are
# made up for this job.
test mcp:
  stage: check search index
  needs:
    - build documentation
  services:
    - name: typesense/typesense:30.2
      alias: typesense
  variables:
    # Configuration of the Typesense service container.
    TYPESENSE_API_KEY: ci-check-admin-key
    TYPESENSE_DATA_DIR: /tmp
    BUNDLE_PATH: vendor/bundle
    BUNDLE_FROZEN: "true"
  cache:
    key:
      files:
        - mcp/Gemfile.lock
    paths:
      - mcp/vendor/bundle
  script:
    - source /etc/profile.d/rvm.sh
    - ruby --version
    - TYPESENSE_URL=http://typesense:8108 TYPESENSE_ADMIN_KEY=ci-check-admin-key TYPESENSE_SEARCH_KEY=ci-check-search-key node .vitepress/search/indexer.mts
    - cd mcp
    - bundle install
    - bundle exec rubocop
    - bundle exec rspec
    - MCP_INTEGRATION=1 TYPESENSE_URL=http://typesense:8108 TYPESENSE_SEARCH_KEY=ci-check-search-key bundle exec rspec --tag integration

# Only needed for the container deployment, see `deploy to website`. The
# image of the MCP server carries the agent data and Markdown pages of this
# pipeline's build, like the website image its HTML.
build docker image:
  stage: build docker image
  image: docker:latest
  # Pushes the images the deploy pulls.
  interruptible: false
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:develop
  script:
    # The website, and `search-init` with the search index of the same build
    # (see the `search-init` service in docker/docker-compose.yml).
    - docker build --pull -f docker/Dockerfile -t "$IMAGE" .
    - docker build --pull -f docker/Dockerfile --target search-init -t "$IMAGE-search-init" .
    - docker run --rm "$IMAGE" nginx -t
    - docker build --pull -f mcp/Dockerfile -t "$IMAGE-mcp" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE"
    - docker push "$IMAGE-search-init"
    - docker push "$IMAGE-mcp"
    - docker logout "$CI_REGISTRY"
  only:
    - develop
  # The nightly pipeline only refreshes the screenshots that later pipelines
  # reuse; the website gets them with the next merge.
  except:
    - schedules

deploy to website:
  stage: deploy
  interruptible: false
  before_script:
    - apt update && apt install -y --no-install-recommends rsync
  script:
    # The stack reads its keys from the .env next to docker-compose.yml on the
    # web host, prepared by its administrators; this job does not touch it.
    # Starting the stack also loads the search index of this release, see the
    # `search-init` service. The job does not wait for it: a failed load shows
    # on the web host only, see docker/README.md ("Check the search after a
    # deploy").
    - test -d $HOME/.ssh || mkdir $HOME/.ssh
    - ssh-keyscan -4 $DEPLOYHOST_COMMUNITY >> $HOME/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY_COMMUNITY")
    - rsync -avz docker/docker-compose.yml $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY:/opt/zammad-org/
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY"
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml pull"
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml up -d --remove-orphans"
    # Waits for the services that keep running: `--wait` takes a container that
    # exits — even successfully, like `search-init` — for a failure.
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker compose -f /opt/zammad-org/docker-compose.yml up -d --wait nginx typesense mcp"
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker logout $CI_REGISTRY"
    - ssh -4 $DEPLOYUSER_COMMUNITY@$DEPLOYHOST_COMMUNITY -tt "sudo docker image prune -a -f"
  only:
    - develop
  # Not in the nightly pipeline, see `build docker image`.
  except:
    - schedules
