on:
  pull_request:
  schedule:
    # Every night: generates the screenshots that the other runs reuse, and
    # shows when a change of the Zammad develop UI breaks the suite.
    - cron:  '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Generate the screenshots instead of reusing those of the last nightly run
        type: boolean
        default: false

# A new push to a pull request cancels the run of the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: DavidAnson/markdownlint-cli2-action@v25
      with:
        globs: src/en/**/*.md
  # Generating the screenshots takes a Zammad stack and most of the run's time,
  # so only some runs do it: the nightly one, those started with "force", and
  # pull requests that change the suite or this workflow. All others run
  # `screenshots-reuse` instead.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      screenshots: ${{ github.event_name == 'schedule' || inputs.force || steps.filter.outputs.screenshots == 'true' }}
    steps:
    - if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          screenshots:
            - '.screenshots/**'
            - '.github/workflows/ci.yml'
  # Needs nothing from the lint job, so it starts right away: it is the
  # longest job of the workflow.
  screenshots:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.screenshots == 'true'
    env:
      CI_COMMIT_REF_NAME: ${{github.ref_name}}
      CI_JOB_ID: ${{github.job}}
    outputs:
      artifact-url: ${{ steps.screenshots-artifact.outputs.artifact-url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/checkout@v7
      with:
        repository: zammad/zammad-docker-compose
        path: zammad-docker-compose
    - run: .screenshots/zammad-stack/start.sh
    - run: |
        .screenshots/zammad-stack/screenshots.sh
        test -d src/public/screenshots/generated # check that screenshots were copied from the container
    - run: .screenshots/zammad-stack/stop.sh
    - uses: actions/upload-artifact@v7
      id: screenshots-artifact
      with:
        name: screenshots
        path: src/public/screenshots/generated
  # Takes the screenshots of the last successful nightly run on develop and
  # passes them on as an artifact of this run.
  screenshots-reuse:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.screenshots != 'true'
    permissions:
      actions: read
    outputs:
      artifact-url: ${{ steps.screenshots-artifact.outputs.artifact-url }}
      run-id: ${{ steps.run.outputs.run-id }}
    steps:
    - id: run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch develop --event schedule --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
        if [ -z "$run_id" ]; then
          echo "::error::No successful nightly run on develop to take the screenshots from. Run the workflow with \"force\"."
          exit 1
        fi
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8
      with:
        name: screenshots
        path: src/public/screenshots/generated
        run-id: ${{ steps.run.outputs.run-id }}
        github-token: ${{ github.token }}
    - run: test -d src/public/screenshots/generated
    - uses: actions/upload-artifact@v7
      id: screenshots-artifact
      with:
        name: screenshots
        path: src/public/screenshots/generated
  build:
    runs-on: ubuntu-latest
    needs: [screenshots, screenshots-reuse]
    # Either of the two runs, the other one is skipped.
    if: ${{ !cancelled() && (needs.screenshots.result == 'success' || needs.screenshots-reuse.result == 'success') }}
    # Throwaway search index for the checks below, see .vitepress/search/. The
    # keys are made up for this job; GitHub never gets production credentials.
    services:
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_API_KEY: ci-check-admin-key
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108
    steps:
    - uses: actions/checkout@v7
    - id: sha
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - uses: actions/download-artifact@v8
      with:
        name: screenshots
        path: src/public/screenshots/generated
    - uses: pnpm/action-setup@v6
    # The search scripts run as TypeScript with Node's type stripping.
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        # Keeps the pnpm store between runs for as long as pnpm-lock.yaml does
        # not change.
        cache: pnpm
    # po4a generates the content of the non-English locales.
    - run: sudo apt-get update && sudo apt-get install -y po4a
    - run: pnpm install --frozen-lockfile
    # The language lists of the nginx config have to match the site's, see
    # docker/check_nginx_locales.mts.
    - run: pnpm check:nginx
    # Builds every language into its own directory below dist/, and its search
    # documents into search-index/.
    - run: pnpm build
    # The local search of VitePress must not come back.
    - run: "! grep -rl --include='*.js' localSearchIndex dist/"
    # No locale arguments: both commands cover every search-index/*.jsonl the
    # build produced, and fail on a locale that is missing.
    - run: pnpm search:index
      env:
        TYPESENSE_URL: http://localhost:8108
        TYPESENSE_ADMIN_KEY: ci-check-admin-key
        TYPESENSE_SEARCH_KEY: ci-check-search-key
    - run: pnpm search:check
      env:
        TYPESENSE_URL: http://localhost:8108
        TYPESENSE_SEARCH_KEY: ci-check-search-key
    # The MCP server (mcp/): RuboCop and the specs, then the specs against the
    # build output and the index above.
    - uses: ruby/setup-ruby@v1
      with:
        working-directory: mcp
        bundler-cache: true
    - run: bundle exec rubocop && bundle exec rspec
      working-directory: mcp
    - run: bundle exec rspec --tag integration
      working-directory: mcp
      env:
        MCP_INTEGRATION: 1
        TYPESENSE_URL: http://localhost:8108
        TYPESENSE_SEARCH_KEY: ci-check-search-key
    - uses: actions/upload-artifact@v7
      id: build-artifact
      with:
        name: build-${{ steps.sha.outputs.sha_short }}
        path: dist
    - if: github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v3
      with:
        comment-tag: artifacts
        message: |
          ### Artifacts

          Produced during runtime

          📦 [build-${{ steps.sha.outputs.sha_short }}](${{ steps.build-artifact.outputs.artifact-url }})
          📦 [screenshots](${{ needs.screenshots.outputs.artifact-url || needs.screenshots-reuse.outputs.artifact-url }})${{ needs.screenshots-reuse.outputs.run-id && format(' (reused from the nightly run {0})', needs.screenshots-reuse.outputs.run-id) || '' }}
